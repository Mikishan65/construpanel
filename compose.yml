services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    environment:
      # Hace fiable la detección de cambios en Docker Desktop y WSL.
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "300"

volumes:
  node_modules:
