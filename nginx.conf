server {
    listen 9085;
    server_name ccepcoin.construpanel.tech localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Compresión Gzip para mejorar la velocidad de carga
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/javascript application/xml application/json image/svg+xml;
    gzip_disable "MSIE [1-6]\.";

    # Cabeceras de seguridad
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Cache prolongado para recursos estáticos generados por Vite
    location ~* \.(?:css|js|woff2?|eot|ttf|otf|png|jpe?g|gif|svg|webp|ico|mp4)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Soporte para Single Page Application (React)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Desactivar logs para favicon y robots.txt
    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }

    location = /robots.txt {
        access_log off;
        log_not_found off;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
