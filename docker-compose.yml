services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: construpanel
    restart: unless-stopped
    ports:
      # Puerto mapeado en el VPS: por defecto 9085 (puerto personalizado y poco común).
      - "${PORT:-9085}:9085"
    environment:
      - NODE_ENV=production
